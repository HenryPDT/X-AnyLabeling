# X-AnyLabeling GPLv3 License - https://github.com/CVHub520/X-AnyLabeling/blob/main/LICENSE

# Overview:
# This pyproject.toml file manages the build, packaging, and distribution of the X-AnyLabeling library.
# It defines essential project metadata, dependencies, and settings used to develop and deploy the library.

# Key Sections:
# - [build-system]: Specifies the build requirements and backend (e.g., setuptools, wheel).
# - [project]: Includes details like name, version, description, authors, dependencies and more.
# - [project.optional-dependencies]: Provides additional, optional packages for extended features.
# - [tool.*]: Configures settings for various tools (pytest, yapf, etc.) used in the project.

# Installation:
# The X-AnyLabeling library can be installed using the command: 'pip install "x-anylabeling-cvhub[xxx]"'
# For development purposes, you MUST specify a runtime environment (includes dev tools):
#   - CPU:       pip install -e ".[cpu,dev]"
#   - CUDA 12.x: pip install -e ".[gpu,dev]"
#   - CUDA 11.x: pip install -e ".[gpu-cu11,dev]"
#   - CUDA 13.x: pip install -e ".[gpu-cu13,dev]"
# Note: Ensure onnxruntime and onnxruntime-gpu are not installed simultaneously.
# This approach allows for real-time code modifications without the need for re-installation.

# Docs: https://xanylabeling.com/docs/x-anylabeling/get_started
# Examples: https://github.com/CVHub520/X-AnyLabeling/tree/main/examples/
# GitHub: https://github.com/CVHub520/X-AnyLabeling

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# Project settings -----------------------------------------------------------------------------------------------------
[project]
name = "x-anylabeling-cvhub"
dynamic = ["version"]
description = "A lightweight, unified, cross-platform desktop application for AI-assisted annotation of text, image, video, and multimodal data."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["machine-learning", "deep-learning", "computer-vision", "multi-modal", "auto-labeling", "image-annotation", "AI", "LLM", "VLM", "YOLO", "SAM", "CLIP", "Grounding-DINO", "X-AnyLabeling"]
authors = [
    { name = "Wei Wang", email = "cv_hub@163.com" },
]
maintainers = [
    { name = "CVHub", email = "cvhub.cn@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Core dependencies
# Note: onnx and onnxruntime are in optional-dependencies for version compatibility
dependencies = [
    "natsort>=8.1.0",
    "pillow>=7.1.2",
    "pillow-heif>=0.18.0",
    "opencv-contrib-python-headless>=4.7.0.72",
    "PyQt6>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PyQt6>=6.6.0; sys_platform != 'linux'",
    "PyQt6-WebEngine>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.6.0; sys_platform != 'linux'",
    "qimage2ndarray>=1.10.0",
    "lapx>=0.5.5",
    "tqdm>=4.64.0",
    "scipy>=1.4.1",
    "PyYAML",
    "importlib_metadata",
    "json_repair",
    "jsonlines",
    "markdown",
    "openai",
    "socksio>=1.0.0",
    "psutil",
    "pyclipper",
    "six",
    "shapely",
    "termcolor",
    "tokenizers",
    "requests",
    "darkdetect>=0.8.0",
    "matplotlib",
]

# Optional dependencies ------------------------------------------------------------------------------------------------
[project.optional-dependencies]

dev = [
    "build",
    "pyinstaller",
    "pytest",
    "PySide6>=6.6.0,<6.10.0; sys_platform == 'linux'",
    "PySide6>=6.6.0; sys_platform != 'linux'",
    "ruff>=0.8.0",
    "twine",
]

# CPU version: Latest ONNX + ONNXRuntime
cpu = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.15.0",
]
# CUDA 12.x: Latest ONNX + ONNXRuntime GPU (>= 1.18.1 for CUDA 12.x support)
gpu = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.18.1,<1.27.0; platform_system != 'Darwin'",
]
# CUDA 11.x: ONNX < 1.16.1 + ONNXRuntime GPU < 1.19
gpu-cu11 = [
    "numpy<2.0.0",
    "onnx>=1.15.0,<1.16.1",
    "onnxruntime-gpu>=1.15.0,<1.19.0; platform_system != 'Darwin'",
]
# CUDA 13.x: ONNXRuntime GPU >= 1.27
gpu-cu13 = [
    "numpy>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.27.0,<1.28.0; platform_system != 'Darwin'",
]

[project.urls]
"Homepage" = "https://xanylabeling.com"
"Documentation" = "https://xanylabeling.com/docs/x-anylabeling/get_started"
"Download" = "https://xanylabeling.com/download"
"Funding" = "https://xanylabeling.com/sponsor"
"Source" = "https://github.com/CVHub520/X-AnyLabeling"
"Issues" = "https://github.com/CVHub520/X-AnyLabeling/issues"
"Changelog" = "https://github.com/CVHub520/X-AnyLabeling/releases"

[project.scripts]
xanylabeling = "anylabeling.app:main"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
    [
        { extra = "cpu" },
        { extra = "gpu-cu11" },
    ],
    [
        { extra = "gpu" },
        { extra = "gpu-cu11" },
    ],
    [
        { extra = "cpu" },
        { extra = "gpu-cu13" },
    ],
    [
        { extra = "gpu" },
        { extra = "gpu-cu13" },
    ],
    [
        { extra = "gpu-cu11" },
        { extra = "gpu-cu13" },
    ],
]

# Tools settings -------------------------------------------------------------------------------------------------------
[tool.setuptools]  # configuration specific to the `setuptools` build backend.
packages = { find = { where = ["."], include = ["anylabeling*"], exclude = ["resources*"] } }

[tool.setuptools.dynamic]
version = {attr = "anylabeling.app_info.__version__"}

[tool.pytest.ini_options]
addopts = "--doctest-modules --durations=30 --color=yes"
testpaths = ["tests"]
markers = [
    "slow: skip slow tests unless --slow is set",
]
norecursedirs = [".git", "dist", "build"]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "anylabeling/resources/resources.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "C90",  # mccabe complexity
]
ignore = [
    "E266",  # too many leading '#' for block comment
    "E501",  # line too long (handled by formatter)
    "F403",  # 'from module import *' used; unable to detect undefined names
    "F401",  # imported but unused
    "F405",  # name may be undefined, or defined from star imports (companion to F403)
    "E402",  # module level import not at top of file
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
